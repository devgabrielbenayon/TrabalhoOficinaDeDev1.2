seed: 42
seed_offsets:               # make_rng(cfg, offset): one independent stream per random step
  split: 1
  random_baseline: 2
data:
  format: "Modern"
  months_back: 6
  min_main_cards: 40
  use_sideboard: false
  drop_duplicate_decks: true
  end_date: null            # "YYYY-MM-DD"; null = latest date available in the deck cache
  min_decks: 50
  min_items: 500
source:
  # Original Badaro/MTGODecklistCache was archived on 2025-06-10; this fork keeps
  # the same format and is still updated. The commit is pinned for reproducibility.
  decks_repo: "https://github.com/Jiliac/MTGODecklistCache.git"
  decks_commit: "136284ce52252add48ee953b2438c4e543d63db7"
  deck_sources: ["mtgo.com_limited_data"]   # melee.gg folder mixes in MTGO copies and noisy lists
  scryfall_bulk_api: "https://api.scryfall.com/bulk-data"
  scryfall_bulk_type: "oracle_cards"
  scryfall_named_api: "https://api.scryfall.com/cards/named"
  user_agent: "mtg-recsys-academic/0.1"
  request_delay_s: 0.12     # Scryfall asks for 50-100 ms between requests
split:
  test_fraction: 0.2        # fraction of each deck's distinct non-basic cards held out for test
  validation_fraction: 0.1  # fraction of decks used only to tune block weights
  min_cards_per_deck: 10    # decks with fewer distinct cards are excluded from evaluation
features:
  tfidf:
    ngram_range: [1, 2]
    min_df: 2
    max_features: 20000
  block_weights:            # tuned on the validation decks
    text: 1.0
    types: 0.5
    colors: 0.5
    keywords: 0.5
    numeric: 0.3
  # "scaled": divide numeric block by sqrt(5) (keeps cmc/P/T magnitudes);
  # "l2": per-row L2 like the other blocks (every non-creature becomes [1,0,0,0,0]).
  numeric_norm: "scaled"
  sample_cards: ["Lightning Bolt", "Ragavan, Nimble Pilferer", "Fable of the Mirror-Breaker // Reflection of Kiki-Jiki"]
  embeddings:
    enabled: true
    model: "sentence-transformers/all-MiniLM-L6-v2"
recommend:
  max_copies: 4             # profile weight of a card = min(copies, max_copies) / max_copies
  explain_top_features: 5   # features listed in each explanation
  demo_deck_id: null        # deck printed by `python -m src.demo`; null = first eval deck
  demo_n: 10
  n_values: [5, 10]
  color_filter: false       # evaluated with and without
  mmr:
    enabled: false
    lambda: 0.7
evaluate:
  batch_size: 512           # decks scored per sparse matrix product
  search_n: 10              # weight search criterion: mean nDCG@search_n on validation decks
  weight_grid:              # only ratios matter (rows are re-normalized), so text is fixed
    text: [1.0]
    types: [0.0, 0.25, 0.5, 1.0]
    colors: [0.0, 0.25, 0.5, 1.0]
    keywords: [0.0, 0.25, 0.5, 1.0]
    numeric: [0.0, 0.3, 0.6]
paths:
  raw: "data/raw"
  processed: "data/processed"
  results: "results"
